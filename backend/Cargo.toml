[package]
name = "beerwithme"
version = "1.0.0"
authors = ["Nicolas Pernoud <github@ninico.fr>"]
edition = "2021"

[dependencies]
actix-web = "4.13.0"
diesel = { version = "2.3.9", features = ["chrono", "r2d2", "sqlite"] }
diesel_migrations = "2.3.2"
env_logger = "0.11.10"
r2d2 = "0.8.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
libsqlite3-sys = { version = "0.37.0", features = ["bundled"] }
chrono = { version = "0.4.44", features = ["serde"] }
actix-cors = "0.7.1"
actix-files = "0.6.10"
image = "0.25.10"
futures-core = "0.3.32"
futures-util = "0.3.32"
actix-web-httpauth = "0.8.2"
rand = "0.10.1"
log = "0.4.30"

[dev-dependencies]
actix-rt = "2.11.0"
regex = "1.12.3"
